namespace: openshift-mcp
clusterSubdomain: ""
name: openshift-mcp-server
# OpenShift MCP Server 1.0 (GA), tag 1.0 pinned by digest
image: registry.redhat.io/openshift-mcp/openshift-mcp-server-rhel9@sha256:c6e59e791a0b934c5a33bf93e29e45b168ba81625f959794fecbdbf657996ac2

# Toolset names of OpenShift MCP Server 1.0 ("metrics" became
# "observability/metrics", "openshift" became "openshift/mustgather").
toolsets:
  - core
  - config
  - observability/metrics
  - netedge
  - openshift/mustgather
  - ossm

users:
  - username: mcp-admin
    email: mcp-admin@example.com
    firstName: MCP
    lastName: Admin
    clusterRole: cluster-admin
  - username: mcp-viewer
    email: mcp-viewer@example.com
    firstName: MCP
    lastName: Viewer
    clusterRole: view

